name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2  # 已锁定到支持 Node 24 的最新 v4 补丁版本

      - name: Set up JDK 17
        uses: actions/setup-java@v4.5.0  # 已锁定到支持 Node 24 的最新 v4 补丁版本
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2  # 已锁定到支持 Node 24 的最新版本

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4.4.3  # 已锁定到支持 Node 24 的最新 v4 补丁版本
        with:
          name: App-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
